<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join the Ecosystem - CodeQueen</title>
    <link rel="icon" type="image/png" href="images/CQimg1.jfif" style="border-radius: 50%;">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        :root {
            --cq-bg-main: #CF6F6B;       /* Big background color */
            --cq-form-accent: #E79A24;   /* Primary form elements accent */
            --cq-form-soft: #F6EBDD;     /* Soft form container fill */
            --cq-text-dark: #3A2312;     /* Deep typography theme color */
        }

        body {
            background-color: var(--cq-bg-main);
            font-family: 'Segoe UI', Arial, sans-serif;
            color: var(--cq-text-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .split-container {
            min-height: 85vh;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        /* LEFT PANEL: The Registration Form Container */
        .form-side {
            background-color: var(--cq-form-soft);
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-control, .form-select {
            border: 1px solid #ebd2b8;
            background-color: #ffffff;
            color: var(--cq-text-dark);
            padding: 10px 14px;
            border-radius: 12px;
        }

        /* Fix border rounding behavior for elements locked into input-groups */
        .input-group .form-control {
            border-top-right-radius: 0;
            border-bottom-right-radius: 0;
        }

        .input-group-text {
            border: 1px solid #ebd2b8;
            background-color: #ffffff;
            color: var(--cq-text-dark);
            border-top-right-radius: 12px;
            border-bottom-right-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .input-group-text:hover {
            color: var(--cq-form-accent);
            background-color: #fcf8f2;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--cq-form-accent);
            box-shadow: 0 0 0 0.25rem rgba(231, 154, 36, 0.2);
        }
        
        .input-group:focus-within .input-group-text {
            border-color: var(--cq-form-accent);
        }

        .form-label {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 6px;
        }

        .btn-register {
            background-color: var(--cq-form-accent);
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1.1rem;
            transition: all 0.2s ease;
        }

        .btn-register:hover {
            background-color: #d18619;
            color: #ffffff;
            transform: translateY(-1px);
        }

        /* RIGHT PANEL: Branding Element Presentation Area */
        .brand-side {
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
            border-left: 1px solid rgba(255, 255, 255, 0.1);
        }

        .brand-logo-wrapper {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid var(--cq-form-soft);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            background-color: #ffffff;
            margin-bottom: 24px;
        }

        .brand-logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .brand-title {
            color: var(--cq-form-soft);
            font-weight: 800;
            letter-spacing: 2px;
            font-size: 2.8rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.15);
        }

        .brand-subtitle {
            color: rgba(246, 235, 221, 0.85);
            font-size: 1.1rem;
            font-weight: 500;
        }

        /* Responsiveness corrections */
        @media (max-width: 991.98px) {
            .split-container {
                border-radius: 20px;
                margin: 20px 10px;
            }
            .brand-side {
                order: -1;
                padding: 30px;
                min-height: 250px;
            }
            .brand-title { font-size: 2.2rem; }
            .brand-logo-wrapper { width: 110px; height: 110px; margin-bottom: 12px; }
        }
    </style>
</head>
<body>

    <div class="container my-5">
        <div class="row split-container g-0">
            
            <div class="col-lg-7 form-side">
                <div class="mb-4">
                    <h2 class="fw-bold m-0" style="color: var(--cq-text-dark);">Create Account</h2>
                    <p class="text-muted small">Register into the digital sisterhood & network ecosystem directory.</p>
                </div>

                <div id="statusAlert" class="alert d-none rounded-3 small" role="alert"></div>

                <form id="registrationForm">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" placeholder="e.g. SandraK" required>
                        </div>

                        <div class="col-md-6">
                            <label pour="email" class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                        </div>

                        <div class="col-md-6">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                                <span class="input-group-text" onclick="togglePasswordVisibility('password', 'passwordToggleIcon')">
                                    <i class="bi bi-eye" id="passwordToggleIcon"></i>
                                </span>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label for="confirmPassword" class="form-label">Confirm Password</label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="confirmPassword" placeholder="••••••••" required>
                                <span class="input-group-text" onclick="togglePasswordVisibility('confirmPassword', 'confirmToggleIcon')">
                                    <i class="bi bi-eye" id="confirmToggleIcon"></i>
                                </span>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label for="role" class="form-label">Account Role</label>
                            <select class="form-select" id="role" required>
                                <option value="" selected disabled>Select structural role...</option>
                                <option value="student">Student (Active Cohort)</option>
                                <option value="alumna">Alumna (Graduate)</option>
                                <option value="partner">Corporate Partner</option>
                                <option value="admin">Administrative Staff</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="cohort" class="form-label">Cohort Number</label>
                            <input type="number" class="form-control" id="cohort" min="0" value="0" placeholder="0 if not applicable">
                        </div>

                        <div class="col-12 mt-4">
                            <button type="submit" class="btn btn-register w-100 shadow-sm" id="btnSubmit">
                                <span id="spinner" class="spinner-border spinner-border-sm d-none me-2" role="status"></span>
                                Register Account
                            </button>
                        </div>
                    </div>
                </form>

                <div class="text-center mt-4">
                    <p class="small mb-0 text-muted">Already have an ecosystem account? <a href="login.html" class="fw-bold text-decoration-none" style="color: var(--cq-form-accent);">Log In here</a></p>
                </div>
            </div>

            <div class="col-lg-5 brand-side">
                <div class="brand-logo-wrapper">
                    <img src="images/CQimg1.jfif" alt="CodeQueen Logo">
                </div>
                <h1 class="brand-title text-uppercase mb-1">&lt;codequeen&gt;</h1>
                <p class="brand-subtitle">Alumni & Digital Sisterhood Ecosystem</p>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API_BASE_URL = window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost' ? 'https://cq-a-bckd.onrender.com' : 'http://localhost:5000';
        // Interactive engine method to toggle target attributes natively inside UI elements
        function togglePasswordVisibility(inputId, iconId) {
            const passwordInput = document.getElementById(inputId);
            const toggleIcon = document.getElementById(iconId);
            
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                toggleIcon.classList.remove("bi-eye");
                toggleIcon.classList.add("bi-eye-slash");
            } else {
                passwordInput.type = "password";
                toggleIcon.classList.remove("bi-eye-slash");
                toggleIcon.classList.add("bi-eye");
            }
        }

        document.getElementById('registrationForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const alertBox = document.getElementById('statusAlert');
            const btnSubmit = document.getElementById('btnSubmit');
            const spinner = document.getElementById('spinner');

            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const role = document.getElementById('role').value;
            const cohort = parseInt(document.getElementById('cohort').value) || 0;
            
            const isMentor = false;
            const isleader = false;
            const isAdmin = false;

            if (password !== confirmPassword) {
                showAlert("Different passwords! They don't match!", "danger");
                return;
            }

            alertBox.classList.add('d-none');
            btnSubmit.disabled = true;
            spinner.classList.remove('d-none');

            try {
                const response = await fetch(`${API_BASE_URL}/users/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username,
                        email,
                        password,
                        confirmPassword,
                        role,
                        cohort,
                        isMentor,
                        isAdmin,
                        isleader
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert(data.message || 'User created SUCCESSFULLY!', 'success');
                    
                    if(data.token) {
                        localStorage.setItem('cq_auth_token', data.token);
                        localStorage.setItem('cq_user_profile', JSON.stringify(data.result));
                    }
                    
                    document.getElementById('registrationForm').reset();
                    
                    setTimeout(() => {
                        window.location.href = 'alumni.html';
                    }, 2000);
                } else {
                    showAlert(data.message || 'An error occurred during registration.', 'danger');
                }

            } catch (error) {
                console.error('Registration Pipeline Error Context:', error);
                showAlert('Network connection down. Could not bind payload to database engine endpoint pipeline.', 'danger');
            } finally {
                btnSubmit.disabled = false;
                spinner.classList.add('d-none');
            }
        });

        function showAlert(message, type) {
            const alertBox = document.getElementById('statusAlert');
            alertBox.className = `alert alert-${type} rounded-3 small`;
            alertBox.innerText = message;
            alertBox.classList.remove('d-none');
        }
    </script>
</body>
</html>
