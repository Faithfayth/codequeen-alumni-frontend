<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Achievements - Admin Space</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="icon" type="image/png" href="images/CQimg1.jfif">
    <style>
        :root {
            --cq-clay: #C56C64;
            --cq-gold: #E39224;
            --cq-cream: #FFF5E9;
            --cq-dark: #3A2312;
            --cq-light: #FFFBF7;
        }

        body {
            background-color: #FFFFFF;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: var(--cq-dark);
        }

        /* Mobile Header Top Navigation Band */
        .mobile-header {
            display: none;
            background-color: var(--cq-clay);
            padding: 12px 20px;
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1050;
            align-items: center;
            justify-content: space-between;
        }

        /* App Persistent Left Sidebar Navigation Drawer Frame */
        .cq-sidebar {
            background-color: var(--cq-clay);
            width: 260px;
            height: 100vh;
            position: fixed;
            left: 0; top: 0;
            padding: 20px 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 1040;
            transition: transform 0.3s ease-in-out;
        }

        .cq-nav-link {
            color: #FFFFFF;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .cq-nav-link:hover, .cq-nav-link.active {
            background-color: #FFFFFF;
            color: var(--cq-clay);
            font-weight: 600;
        }

        .main-workspace {
            margin-left: 260px;
            padding: 30px;
        }

        /* Add Action Trigger Button Quick Link */
        .btn-add-shortcut {
            border: 1px solid var(--cq-gold);
            background-color: transparent;
            color: var(--cq-gold);
            border-radius: 8px;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            transition: all 0.2s;
        }

        .btn-add-shortcut:hover {
            background-color: var(--cq-cream);
            color: var(--cq-dark);
        }

        /* Achievement Entry Display Cards Style Design Sheets */
        .achievement-item-card {
            background-color: var(--cq-light);
            border: 1px solid var(--cq-cream);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            gap: 24px;
            position: relative;
        }

        .achievement-photo-frame {
            width: 150px;
            height: 150px;
            background-color: var(--cq-cream);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--cq-clay);
            overflow: hidden;
            flex-shrink: 0;
            border: 1px solid rgba(197, 108, 100, 0.1);
        }

        .achievement-photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .achievement-details-box {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Structural Outline Control Action Buttons Panel Layout */
        .action-outline-btn {
            border: 1px solid var(--cq-gold);
            background-color: #FFFFFF;
            color: var(--cq-gold);
            font-size: 0.85rem;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .action-outline-btn:hover {
            background-color: var(--cq-cream);
        }

        .action-outline-btn.btn-delete-mode {
            border-color: var(--cq-clay);
            color: var(--cq-clay);
        }

        .action-outline-btn.btn-delete-mode:hover {
            background-color: rgba(197, 108, 100, 0.08);
        }

        /* Lower Interactive Studio Section: Add Achievement Box Layout */
        .form-studio-card {
            border-top: 1px solid rgba(197, 108, 100, 0.15);
            padding-top: 30px;
            margin-top: 40px;
        }

        .photo-uploader-dashed-box {
            border: 2px dashed var(--cq-gold);
            background-color: var(--cq-light);
            border-radius: 14px;
            height: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--cq-clay);
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .photo-uploader-dashed-box:hover {
            background-color: var(--cq-cream);
        }

        .form-control, .form-select {
            background-color: var(--cq-light);
            border: 1px solid var(--cq-cream);
            border-radius: 10px;
            padding: 10px 14px;
            color: var(--cq-dark);
        }

        .form-control:focus, .form-select:focus {
            background-color: #FFFFFF;
            border-color: var(--cq-gold);
            box-shadow: 0 0 0 0.25rem rgba(227, 146, 36, 0.15);
        }

        .btn-action-submit {
            background-color: var(--cq-gold);
            color: #FFFFFF;
            font-weight: 600;
            padding: 10px 24px;
            border-radius: 10px;
            border: none;
            transition: all 0.2s;
        }

        .btn-action-submit:hover {
            background-color: #d1821b;
            color: #FFFFFF;
        }

        @media (max-width: 767.98px) {
            .mobile-header { display: flex; }
            .cq-sidebar { transform: translateX(-100%); }
            .cq-sidebar.show-sidebar { transform: translateX(0); }
            .main-workspace { margin-left: 0; padding-top: 80px; }
            .achievement-item-card { flex-direction: column; gap: 16px; }
            .achievement-photo-frame { width: 100%; height: 200px; }
        }
    </style>
</head>
<body>

    <div class="mobile-header">
        <span class="text-white fw-bold">Community Achievements</span>
        <button class="btn text-white fs-3 p-0" id="mobile-sidebar-toggle"><i class="bi bi-list"></i></button>
    </div>

    <div class="cq-sidebar" id="app-sidebar">
        <div>
            <div class="text-center pb-3 mb-3 border-bottom border-light border-opacity-25">
                <h5 class="fw-bold text-white mb-0">CODEQUEEN</h5>
                <small class="text-white opacity-75">Admin Space</small>
            </div>
            <nav class="nav flex-column gap-1">
                <a href="admin.html" class="cq-nav-link"><i class="bi bi-speedometer2"></i> Dashboard</a>
                <a href="badgesA.html" class="cq-nav-link"><i class="bi bi-award"></i> Badges</a>
                <a href="cohortsA.html" class="cq-nav-link"><i class="bi bi-people"></i> Cohorts</a>
                <a href="enrollmentsA.html" class="cq-nav-link"><i class="bi bi-file-earmark-text"></i> Enrollment</a>
                <a href="alumni-directoryA.html" class="cq-nav-link"><i class="bi bi-journal-bookmark"></i> Alumni directory</a>
                <a href="achievementsA.html" class="cq-nav-link active"><i class="bi bi-trophy"></i> Achievements</a>
                <a href="electionsA.html" class="cq-nav-link"><i class="bi bi-box-seam"></i> Elections</a>
                <a href="studentsA.html" class="cq-nav-link"><i class="bi bi-mortarboard"></i> Students</a>
                <a href="partnersA.html" class="cq-nav-link"><i class="bi bi-building"></i> Partners</a>
                <a href="usersA.html" class="cq-nav-link"><i class="bi bi-person-gear"></i> Users</a>
            </nav>
        </div>
    </div>

    <div class="main-workspace">
        
        <div class="row align-items-center mb-4 g-3">
            <div class="col-6 d-flex align-items-center gap-3">
                <button class="btn-add-shortcut" onclick="scrollToStudioFormDeck()" title="Jump to entry studio"><i class="bi bi-plus-lg"></i></button>
                <h3 class="fw-bold text-dark mb-0">Community Achievements</h3>
            </div>
            <div class="col-6 d-flex justify-content-end align-items-center gap-3">
                <div class="input-group" style="max-width: 260px;">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-search"></i></span>
                    <input type="text" class="form-control border-start-0 ps-0" id="achievements-search-bar" placeholder="Search" onkeyup="executeAchievementsSearchFilter()">
                </div>
                <span class="badge bg-warning text-dark px-3 py-2 rounded-pill fw-semibold d-none d-sm-inline-block"><i class="bi bi-shield-lock me-1"></i>Admin</span>
            </div>
        </div>

        <div id="achievements-dynamic-deck-container">
            <div class="text-center py-5 text-muted">
                <div class="spinner-border spinner-border-sm text-clay mb-2"></div>
                <div>Fetching achievements history pipeline streams...</div>
            </div>
        </div>

        <div class="form-studio-card" id="studio-form-deck-anchor">
            <h4 class="fw-bold text-clay mb-4" id="studio-form-title">Add Achievement</h4>
            
            <form id="achievement-mutation-form" onsubmit="executeSubmitFormRegistryEntry(event)">
                <input type="hidden" id="form-entry-operation-id" value="">

                <div class="row g-4">
                    <div class="col-md-4">
                        <div class="photo-uploader-dashed-box" onclick="triggerSystemVirtualFileSelect()">
                            <input type="file" id="form-hidden-file-input" accept="image/*" class="d-none" onchange="processLocalPhotoPreviewLoad(event)">
                            <div class="text-center p-3" id="uploader-prompt-content-view">
                                <i class="bi bi-image fs-1 mb-2 d-block"></i>
                                <span class="fw-bold d-block mb-1">Photo</span>
                                <small class="text-muted d-block text-lowercase">Add photo asset here</small>
                            </div>
                            <img id="uploader-image-preview-node" src="" class="d-none" alt="Preview selection">
                        </div>
                    </div>

                    <div class="col-md-8">
                        <div class="d-flex flex-column gap-3">
                            <div>
                                <label class="form-label small fw-bold text-secondary mb-1">Add title</label>
                                <input type="text" class="form-control" id="form-achievement-title" placeholder="Enter title" required>
                            </div>

                            <div>
                                <label class="form-label small fw-bold text-secondary mb-1">Description</label>
                                <textarea class="form-control" id="form-achievement-desc" rows="4" placeholder="Enter description" required></textarea>
                            </div>

                            <div class="row g-3">
                                <div class="col-sm-6">
                                    <label class="form-label small fw-bold text-secondary mb-1">Category</label>
                                    <select class="form-select" id="form-achievement-category" required>
                                        <option value="" disabled selected>Select category</option>
                                        <option value="Career Milestone">Career Milestone</option>
                                        <option value="Community Impact">Community Impact</option>
                                        <option value="Innovation & Tech">Innovation & Tech</option>
                                        <option value="Academic Excellence">Academic Excellence</option>
                                    </select>
                                </div>
                                <div class="col-sm-6">
                                    <label class="form-label small fw-bold text-secondary mb-1">Date</label>
                                    <div class="input-group">
                                        <input type="date" class="form-control" id="form-achievement-date" required>
                                    </div>
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-3 pt-2">
                                <button type="button" class="btn btn-light px-4 rounded-3 d-none" id="btn-cancel-update-mode" onclick="exitUpdateActiveStateWindow()">Cancel</button>
                                <button type="submit" class="btn-action-submit px-5" id="btn-submit-action-text">Save Changes</button>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="achievementsA.js"></script>
</body>
</html>
