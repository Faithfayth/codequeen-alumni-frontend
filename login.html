<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codequeen - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --cq-brand-gold: #E39224;   /* Exact background color from the layout */
            --cq-card-cream: #FFF5E9;   /* Soft warm background of the login box */
            --cq-btn-terracotta: #C56C64;/* Core button tone */
            --cq-text-dark: #3A2312;    /* Warm dark text color */
        }

        body {
            background-color: var(--cq-brand-gold);
            font-family: 'Fredoka', 'Quicksand', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            position: relative;
        }

        /* Fixed Top Left Home Layout Position Placement Frame */
        .btn-home-fixed-top {
            position: absolute;
            top: 25px;
            left: 25px;
            color: #FFFFFF;
            font-size: 1.8rem;
            text-decoration: none;
            font-weight: 400;
            display: inline-flex;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.2s;
        }

        .btn-home-fixed-top:hover {
            opacity: 0.85;
            color: var(--cq-card-cream);
        }

        .btn-home-fixed-top span {
            margin-right: 12px;
            font-weight: 300;
        }

        .login-container-card {
            width: 100%;
            max-width: 950px;
            background-color: var(--cq-brand-gold);
        }

        /* BRANDING BLOCK LOGO LAYER */
        .brand-logo-pane {
            color: #FFFFFF;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .bee-logo-svg {
            width: 140px;
            height: 140px;
            margin-bottom: 20px;
        }

        .brand-text-title {
            font-size: 3.5rem;
            font-weight: 500;
            letter-spacing: 1px;
            color: #FFFFFF;
        }

        /* LOGIN INPUT FORM CONTAINER BOX */
        .login-box-card {
            background-color: var(--cq-card-cream);
            border-radius: 32px;
            padding: 40px 35px;
            border: 2px solid var(--cq-btn-terracotta);
            max-width: 440px;
            margin-left: auto;
        }

        .login-box-card h2 {
            color: var(--cq-btn-terracotta);
            font-size: 2.8rem;
            font-weight: 500;
            text-align: center;
            margin-bottom: 25px;
        }

        .form-label-custom {
            color: var(--cq-btn-terracotta);
            font-size: 1.25rem;
            margin-bottom: 6px;
            font-weight: 400;
        }

        .form-control-custom {
            background-color: #FFFFFF;
            border: 2px solid var(--cq-btn-terracotta);
            border-radius: 14px;
            padding: 10px 16px;
            font-size: 1.05rem;
            color: var(--cq-text-dark);
            box-shadow: none !important;
        }

        .form-control-custom:focus {
            border-color: var(--cq-brand-gold);
        }

        .btn-login-custom {
            background-color: var(--cq-btn-terracotta);
            color: #FFFFFF;
            border: none;
            border-radius: 14px;
            padding: 10px 40px;
            font-size: 1.4rem;
            font-weight: 500;
            width: 100%;
            margin-top: 20px;
            transition: opacity 0.2s;
        }

        .btn-login-custom:hover {
            opacity: 0.9;
            color: #E39224;
        }

        /* UTILITY SIGNUP LINK STYLING INSIDE CARD CONTAINER */
        .signup-toggle-link {
            display: block;
            text-align: center;
            color: var(--cq-btn-terracotta);
            font-size: 1.6rem;
            text-decoration: none;
            margin-top: 20px;
            font-weight: 400;
        }

        .signup-toggle-link:hover {
            color: var(--cq-text-dark);
        }

        .signup-toggle-link span {
            margin-right: 10px;
            font-weight: 300;
        }

        /* ALERT BANNER WRAPPER */
        #error-banner-view {
            display: none;
            font-size: 0.95rem;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<a href="index.html" class="btn-home-fixed-top">
    <span>|</span> Home
</a>

<div class="login-container-card">
    <div class="row align-items-center g-4">
        
        <div class="col-md-6 text-center text-md-start">
            <div class="brand-logo-pane">
                <div class="brand-logo text-center">
                    <img src="images/codequeen logo.png" alt="Codequeen Logo" class="img-fluid w-75 mx-auto d-block">
                </div>
                <h1 class="brand-text-title">&lt; Codequeen &gt;</h1>
            </div>
        </div>

        <div class="col-md-6">
            <div class="login-box-card shadow">
                <h2>Login</h2>
                
                <div class="alert alert-danger p-2 mb-3 text-center" id="error-banner-view"></div>

                <form id="login-form-element" novalidate>
                    <div class="mb-3">
                        <label for="input-user-email" class="form-label form-label-custom">email</label>
                        <input type="email" class="form-control form-control-custom" id="input-user-email" required autocomplete="email">
                    </div>
                    
                    <div class="mb-4">
                        <label for="input-user-password" class="form-label form-label-custom">password</label>
                        <div class="position-relative">
                            <input type="password" class="form-control form-control-custom pe-5" id="input-user-password" required autocomplete="current-password">
                            <button type="button" id="toggle-password-visibility" class="btn position-absolute top-50 end-0 translate-middle-y border-0 bg-transparent" style="color: var(--cq-btn-terracotta); z-index: 10; padding-right: 16px;">
                                <i class="fa-solid fa-eye" id="password-eye-icon"></i>
                            </button>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-login-custom shadow-sm" id="submit-btn-spinner-target">
                        Login
                    </button>
                </form>

                <a href="signup.html" class="signup-toggle-link">
                    <span>|</span> Signup
                </a>
            </div>
        </div>

    </div>
</div>

<script src="login.js"></script>
</body>
</html>
